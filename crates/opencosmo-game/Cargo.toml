[package]
name = "opencosmo-game"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "opencosmo"
path = "src/main.rs"

[dependencies]
bevy = { version = "0.16", features = ["wav", "serialize"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
opencosmo-assets = { path = "../opencosmo-assets" }

[build-dependencies]
opencosmo-assets = { path = "../opencosmo-assets" }
anyhow = "1"
